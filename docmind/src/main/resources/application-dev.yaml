server:
  port: 8080

spring:
  application:
    name: docmind

#DB configurations
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50B


# llm configurations
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:demo-key}
      chat:
        model: ${OPENROUTER_CHAT_MODEL:openrouter/free}
        temperature: 0.2
        options:
          max-tokens: 2000
      embedding:
        model: ${OPENROUTER_EMBEDDING_MODEL:openrouter/free}


    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_table
        schema-name: public
        initialize-schema: true


# app configurations

app:
  reg:
    chunk-size: 600
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET,PUT,POST,DELETE,OPTIONS
    allowed-headers: "*"




